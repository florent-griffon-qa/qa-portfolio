# Local stack: the Restful-Booker API and the test runners.
# Run from the repo root: docker compose -f docker/docker-compose.yml run --rm api-tests
name: qa-portfolio

services:
  restful-booker:
    image: mwinteringham/restfulbooker@sha256:e4a04233731ceca2e6d99bca16689e0d4bc44631047ab351b6f11b5fa08fb418
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD', 'curl', '-fs', '-o', '/dev/null', 'http://localhost:3001/booking']
      interval: 2s
      timeout: 3s
      retries: 30

  api-tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      restful-booker:
        condition: service_healthy
    environment:
      ENV: local
      BASE_URL: http://restful-booker:3001
    volumes:
      - ../reports:/work/reports
    command: ['npm', 'run', 'test:api']
